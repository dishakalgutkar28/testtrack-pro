name: CD Production - Deploy to Production Environment

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://testtrackpro.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      # Create Release Tag
      - name: Get version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d')-${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"
      
      # Backend Deployment
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --production
      
      - name: Backup database
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
        run: |
          echo "Creating database backup..."
          # Add backup script here
          # mysqldump -h $DB_HOST -u $DB_USER -p$DB_PASSWORD $DB_NAME > backup-$(date +%Y%m%d-%H%M%S).sql
      
      - name: Run database migrations
        working-directory: ./backend
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
        run: |
          echo "Running production database migrations..."
          # npm run migrate:prod
      
      - name: Deploy backend to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service backend --environment production
      
      # Frontend Deployment
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend for production
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}
          REACT_APP_ENV: production
          GENERATE_SOURCEMAP: false
        run: npm run build
      
      - name: Deploy frontend to Vercel Production
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
        run: |
          npm i -g vercel
          vercel --prod --token=$VERCEL_TOKEN
      
      # Health Checks
      - name: Wait for deployment
        run: sleep 60
      
      - name: Production health check - Backend
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PROD_API_URL }}/health)
            if [ $response -eq 200 ]; then
              echo "✅ Backend health check passed (attempt $i)"
              break
            else
              echo "⚠️  Backend health check failed with status $response (attempt $i/5)"
              if [ $i -eq 5 ]; then
                exit 1
              fi
              sleep 10
            fi
          done
      
      - name: Production health check - Frontend
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://testtrackpro.com)
            if [ $response -eq 200 ]; then
              echo "✅ Frontend health check passed (attempt $i)"
              break
            else
              echo "⚠️  Frontend health check failed with status $response (attempt $i/5)"
              if [ $i -eq 5 ]; then
                exit 1
              fi
              sleep 10
            fi
          done
      
      # Smoke Tests
      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          # npm run test:smoke:prod
      
      # Create Git Tag
      - name: Create release tag
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a v${{ steps.version.outputs.VERSION }} -m "Release v${{ steps.version.outputs.VERSION }}"
          git push origin v${{ steps.version.outputs.VERSION }}
      
      # Monitor for errors
      - name: Monitor deployment for 5 minutes
        if: success()
        run: |
          echo "Monitoring production for errors..."
          sleep 300
          echo "✅ No critical errors detected in first 5 minutes"
      
      # Rollback on failure
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, initiating rollback..."
          # Add rollback script here
          # railway rollback --service backend --environment production
          # vercel rollback
      
      # Notifications
      - name: Notify on Slack - Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚀 Production Deployment Successful!",
              "attachments": [{
                "color": "good",
                "fields": [
                  { "title": "Version", "value": "${{ steps.version.outputs.VERSION }}", "short": true },
                  { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "URL", "value": "https://testtrackpro.com", "short": true }
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Notify on Slack - Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "❌ Production Deployment Failed!",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Action", "value": "Rollback initiated", "short": true }
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Production Deployment ${{ job.status }}
          body: |
            Production deployment ${{ job.status }}
            Version: ${{ steps.version.outputs.VERSION }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            URL: https://testtrackpro.com
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: TestTrack Pro CI/CD
