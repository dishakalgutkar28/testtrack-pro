<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Execute Testcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2>Execute Testcase</h2>

    <form action="/save-execution" method="POST" id="execForm">
      <input type="hidden" name="testcase_id" id="testcaseId">

      <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select" required>
          <option value="PASS">PASS</option>
          <option value="FAIL">FAIL</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Remarks</label>
        <input name="remarks" class="form-control">
      </div>

      <button class="btn btn-primary" type="submit">Submit</button>
      <a href="/dashboard" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>

  <script>
    // put testcase id into hidden field by reading URL (execute-testcase/:id)
    (function(){
      const parts = window.location.pathname.split("/");
      const id = parts[parts.length - 1] || "";
      document.getElementById("testcaseId").value = id;
    })();
  </script>
</body>
</html>
