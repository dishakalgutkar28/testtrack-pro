# Railway Configuration for Backend Deployment
# Root Directory is set to / (repo root) in Railway settings
[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts"

[deploy]
startCommand = "bash backend/railway-start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
