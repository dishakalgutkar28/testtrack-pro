# Railway Configuration for Backend Deployment
# Root Directory is set to /backend in Railway settings
[build]
builder = "NIXPACKS"
buildCommand = "npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts"

[deploy]
startCommand = "bash railway-start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
