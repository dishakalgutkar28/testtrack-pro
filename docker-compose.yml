version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: testtrack-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testtrack}
      MYSQL_USER: ${MYSQL_USER:-testtrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testtrack123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - testtrack-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testtrack-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      PORT: 5000
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-testtrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testtrack123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testtrack}
      GMAIL_USER: ${GMAIL_USER:-your-email@gmail.com}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-your-app-password}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      timeout: 10s
      retries: 5
      interval: 30s
    networks:
      - testtrack-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testtrack-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
      REACT_APP_ENV: ${REACT_APP_ENV:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/"]
      timeout: 10s
      retries: 5
      interval: 30s
    networks:
      - testtrack-network

volumes:
  db_data:
    driver: local

networks:
  testtrack-network:
    driver: bridge
